<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1e9">
    <meta name="author" content="{{ site.author.name }}">
    <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}">

    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}?v=20260906-2">
    <link rel="icon" href="{{ '/favicon.png' | relative_url }}?v=20260906-2" type="image/png" sizes="512x512">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}?v=20260906-2" type="image/svg+xml">
    <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include site-header.html %}

    <main class="site-main" id="main-content">
      {{ content }}
    </main>

    {% include site-footer.html %}
  </body>
</html>
