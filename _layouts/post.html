---
layout: default
---
<article class="prose post">
  <header class="page-intro post__header">
    <p class="eyebrow">Writing</p>
    <h1>{{ page.title }}</h1>
    <p class="post__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
      {% if page.reading_time %}<span aria-hidden="true">·</span> {{ page.reading_time }} min read{% endif %}
    </p>
    {% if page.description %}<p class="lede">{{ page.description }}</p>{% endif %}
  </header>

  <div class="post__content">
    {{ content }}
  </div>

  <footer class="post__footer">
    <a class="text-link" href="{{ '/writing/' | relative_url }}">← All writing</a>
  </footer>
</article>
